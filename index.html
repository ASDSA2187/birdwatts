/* Концепция: журнал наблюдений, ставший торговым терминалом — светлая «бумага», морской индиго, кобальт бренда,
   одно сильное место (панель решения), моноширинные подписи как показания приборов.
   Цвета бренда — Pantone (экранные значения по Pantone Connect):
   кобальт PMS 300 C #005EB8 · индиго PMS 289 C #0C2340 · туман PMS 7541 C #D9E1E2 · графит Cool Gray 11 C #53565A
   сигнал PMS 1585 C #FF6A13 · остановка PMS 485 C #DA291C · норма PMS 340 C #00965E */
:root {
  --paper: #F5F8F9; --surface: #FFFFFF; --ink: #0C2340; --muted: #53565A; --line: #D9E1E2; --fill: #EAF0F2;
  --cobalt: #005EB8; --cobalt-ink: #FFFFFF; --signal: #FF6A13; --stop: #DA291C; --calm: #00965E; --hatch: rgba(12,35,64,.06);
  --f-display: "Unbounded", "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1: .8125rem; --s0: 1rem; --s1: 1.1875rem; --s2: 1.5rem; --s3: 2rem; --s4: clamp(2.1rem, 5.2vw, 3.9rem);
  --r: 14px; --wrap: 72rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0C2340; --surface: #11305A; --ink: #EEF3F6; --muted: #A9B8C9; --line: rgba(217,225,226,.16); --fill: rgba(217,225,226,.07);
  --cobalt: #5AA2EC; --cobalt-ink: #0C2340; --signal: #FF8A45; --stop: #FF5A4C; --calm: #2BC48A; --hatch: rgba(238,243,246,.05); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0C2340; --surface: #11305A; --ink: #EEF3F6; --muted: #A9B8C9; --line: rgba(217,225,226,.16); --fill: rgba(217,225,226,.07);
  --cobalt: #5AA2EC; --cobalt-ink: #0C2340; --signal: #FF8A45; --stop: #FF5A4C; --calm: #2BC48A; --hatch: rgba(238,243,246,.05); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 var(--s0)/1.55 var(--f-body); -webkit-font-smoothing: antialiased; font-kerning: normal; font-feature-settings: "kern", "liga"; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: var(--s4); line-height: 1.04; letter-spacing: -.035em; }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); line-height: 1.1; letter-spacing: -.03em; }
h3 { font-size: var(--s1); line-height: 1.25; letter-spacing: -.015em; }
p { margin: 0; max-width: 62ch; }
.mono { font-family: var(--f-mono); font-size: var(--s-1); letter-spacing: .02em; }
.eyebrow { font-family: var(--f-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--cobalt); }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; border-radius: 4px; }
button { font: inherit; cursor: pointer; }

/* шапка */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 1rem; padding-block: .7rem; }
.brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); margin-right: auto; }

/* словесный знак: Unbounded 700, ручной кернинг пар B-i, W-a, t-t */
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -.02em; line-height: 1; white-space: nowrap; }
.wordmark .k-bi { letter-spacing: -.015em; } .wordmark .k-wa { letter-spacing: -.075em; } .wordmark .k-tt { letter-spacing: -.035em; }
.wordmark .w { color: var(--cobalt); }
nav.links { display: flex; gap: 1.2rem; }
nav.links a { color: var(--ink); text-decoration: none; font-size: .9rem; }
nav.links a:hover { color: var(--cobalt); }
.langsel { position: relative; display: inline-flex; align-items: center; }
.langsel svg { position: absolute; left: .6rem; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.langsel::after { content: ""; position: absolute; right: .7rem; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); pointer-events: none; }
.langsel select { appearance: none; -webkit-appearance: none; font: 500 .82rem var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .4rem 1.9rem .4rem 2rem; cursor: pointer; max-width: 9.5rem; }
.langsel select:hover { border-color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: .5rem; border-radius: 999px; padding: .7rem 1.25rem; font-weight: 600; font-size: .95rem; border: 1px solid transparent; text-decoration: none; transition: transform .15s, background .15s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--cobalt); color: var(--cobalt-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--cobalt) 88%, var(--ink)); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-sm { padding: .45rem .9rem; font-size: .85rem; }
.trialchip { font: 500 .75rem var(--f-mono); padding: .35rem .7rem; border-radius: 999px; background: var(--fill); color: var(--ink); border: 0; }
@media (max-width: 52rem) { nav.links { display: none; } }

/* первый экран */
.hero { padding-block: clamp(2.5rem, 7vw, 5.5rem) clamp(2rem, 5vw, 4rem); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr); gap: clamp(2rem, 5vw, 4.5rem); align-items: end; }
.hero h1 .accent { color: var(--cobalt); display: block; }
.hero .lead { font-size: var(--s1); margin-top: 1.4rem; color: var(--ink); max-width: 36ch; }
.hero .ctas { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 2rem; }
.coords { margin-top: 2.2rem; display: flex; gap: 1.6rem; flex-wrap: wrap; color: var(--muted); }
.proofcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.4rem; position: relative; overflow: hidden; }
.proofcard .row { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; padding-block: .55rem; border-top: 1px dashed var(--line); }
.proofcard .row:first-of-type { border-top: 0; }
.proofcard .big { font-family: var(--f-display); font-size: 2.6rem; font-weight: 600; letter-spacing: -.04em; line-height: 1; color: var(--cobalt); }
.verdict { display: inline-flex; align-items: center; gap: .4rem; font: 600 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: .3rem .65rem; border-radius: 999px; }
.verdict::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
.v-hit, .v-calm { color: var(--calm); background: color-mix(in srgb, var(--calm) 13%, transparent); }
.v-act { color: var(--signal); background: color-mix(in srgb, var(--signal) 14%, transparent); }
.v-watch { color: var(--cobalt); background: color-mix(in srgb, var(--cobalt) 13%, transparent); }
.v-miss, .v-false_alarm { color: var(--stop); background: color-mix(in srgb, var(--stop) 12%, transparent); }
.v-pending, .v-quiet_ok { color: var(--muted); background: var(--fill); }
@media (max-width: 52rem) { .hero .wrap { grid-template-columns: 1fr; } }

section.band { padding-block: clamp(3rem, 7vw, 5.5rem); border-top: 1px solid var(--line); }
.sechead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.2rem 3rem; align-items: end; margin-bottom: 2.4rem; }
.sechead p { color: var(--muted); }
@media (max-width: 52rem) { .sechead { grid-template-columns: 1fr; } }

/* решение */
.decision { background: var(--ink); color: var(--paper); border-radius: calc(var(--r) + 6px); padding: clamp(1.2rem, 3vw, 2.2rem); position: relative; overflow: hidden; }
.decision h2, .decision h3 { color: var(--paper); }
.decision .eyebrow { color: color-mix(in srgb, var(--paper) 65%, transparent); }
.states { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin: 1.6rem 0 1.8rem; }
.state { border-top: 3px solid var(--c); padding-top: .8rem; }
.state h3 { font-size: 1rem; color: var(--c); text-transform: uppercase; letter-spacing: .06em; font-family: var(--f-mono); font-weight: 600; }
.state p { font-size: .9rem; color: color-mix(in srgb, var(--paper) 82%, transparent); margin-top: .4rem; }
.state .who { display: block; margin-top: .35rem; }
.state .who b { color: var(--paper); font-weight: 600; }
@media (max-width: 52rem) { .states { grid-template-columns: 1fr; } }
.nights { display: flex; flex-direction: column; gap: .5rem; position: relative; }
.night { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 9rem; gap: 1rem; align-items: center; background: color-mix(in srgb, var(--paper) 7%, transparent); border-radius: 12px; padding: .85rem 1rem; }
.night .when b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; letter-spacing: -.01em; }
.night .when span { font-size: .8rem; color: color-mix(in srgb, var(--paper) 65%, transparent); }
.night .facts { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: .85rem; }

const pickLang = () => { const codes = LANGS.map((l) => l[0]); const nav = (navigator.languages || [navigator.language || "en"]).map((x) => x.toLowerCase().split("-")[0]).map((x) => (x === "no" || x === "nn" ? "nb" : x));
  return nav.find((x) => codes.includes(x)) || "en"; };
let lang = (() => { const s = store.get("bw_lang"); return s && T[s] ? s : pickLang(); })();
let DATA = null;
const LIVE = location.hash === "#live";   // живые сигналы видны только по ссылке с #live (для показа владельцем)
const t = (k) => (T[lang] && T[lang][k] !== undefined ? T[lang][k] : T.en[k]);
const locale = () => (LANGS.find((l) => l[0] === lang) || LANGS[1])[2];
const fmt = (n, d = 0) => (n == null ? "—" : new Intl.NumberFormat(locale(), { maximumFractionDigits: d, minimumFractionDigits: d }).format(n));
const pct = (x) => (x == null ? "—" : `${Math.round(x * 100)}%`);
const sign = (n) => (n == null ? "—" : `${n > 0 ? "+" : ""}${fmt(n, 1)}`);
const dayLabel = (iso, wd) => new Intl.DateTimeFormat(locale(), wd ? { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" } : { day: "numeric", month: "long", timeZone: "UTC" }).format(new Date(iso + "T12:00:00Z"));
const el = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; };
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, parent) => { const x = document.createElementNS(NS, tag); Object.entries(attrs || {}).forEach(([k, v]) => x.setAttribute(k, v)); if (parent) parent.append(x); return x; };

/* ---------------- тексты и шапка ---------------- */
function applyText() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((n) => { const v = t(n.dataset.t); if (typeof v === "string") n.textContent = v; });
  const sel = document.getElementById("lang-sel");
  if (!sel.options.length) LANGS.forEach(([c, n]) => { const o = document.createElement("option"); o.value = c; o.textContent = n; o.lang = c; sel.append(o); });
  sel.value = lang; sel.setAttribute("aria-label", t("lang_label"));
}

/* ---------------- первый экран: последний подтверждённый сигнал ---------------- */
function renderProofCard() {
  const hit = [...DATA.log].reverse().find((r) => r.verdict === "hit");
  if (!hit) return;
  const [d, w] = hit.part.split(" ");
  document.getElementById("pc-when").textContent = `${dayLabel(d)} · ${w === "утро" ? t("morn") : t("eve")}`;
  document.getElementById("pc-verdict").textContent = t("verdicts").hit;
  document.getElementById("pc-risk-l").textContent = t("pc_risk")(hit.lead);
  document.getElementById("pc-risk").textContent = pct(hit.risk);
  document.getElementById("pc-window").textContent = t("pc_window")(hit.window);
  const f = DATA.next.find((r) => r.part === hit.part);
  document.getElementById("pc-mw").textContent = f ? `${fmt(f.mw)} MW` : "—";
}

/* ---------------- итог: решения на ближайшие ночи ---------------- */
function renderDecision() {
  const box = document.getElementById("nights"); box.replaceChildren();
  DATA.next.forEach((r) => {
    const row = el("div", "night");
    const when = el("div", "when"); when.append(el("b", null, dayLabel(r.date, true)), el("span", null, `${r.evening ? t("eve") : t("morn")} · ${t("in_d")(r.lead)}`));
    const facts = el("div", "facts");
    const fact = (label, value, meter, color) => { const d = el("div"); d.append(el("span", null, label), el("b", "num", value));
      if (meter != null) { const m = el("div", "meter"), i = el("i"); i.style.width = pct(meter); i.style.background = color; m.append(i); d.append(m); } facts.append(d); };
    fact(t("f_risk"), pct(r.risk), r.risk, r.level === "high" ? "var(--signal)" : "#5AA2EC");
    fact(t("f_ens"), pct(r.ens), r.ens, "#5AA2EC");
    if (r.p != null) fact(t("f_p"), pct(r.p), Math.min(1, r.p / 0.3), "var(--signal)");
    fact(t("f_mw"), fmt(r.mw));
    fact(t("f_up"), `${sign(r.uplift)} ${t("eur_mwh")}`);
    const v = el("div", `bigv ${r.action}`, t(`v_${r.action}`));
    row.append(when, facts, v); box.append(row);
  });
  if (!LIVE) {
    box.querySelectorAll(".night").forEach((n) => { n.style.filter = "blur(5px)"; n.setAttribute("aria-hidden", "true"); });
    const lock = el("div", "lock"), inner = el("div"); const p = el("p", null, t("lock_p"));
    const b = el("button", "btn btn-primary", t("cta_pilot")); b.type = "button";
    b.addEventListener("click", () => openRequest("pilot"));
    inner.append(p, b); lock.append(inner); box.append(lock);
  }
  document.getElementById("dec-foot").textContent = DATA.next.length ? t("dec_foot")(DATA.next[0].issued) : "";
}

/* ---------------- доказательства ---------------- */
function renderKpis() {
  const s = DATA.stats, lift = fmt(s.top5.precision / s.base_rate, 1);
  const items = [t("k1")(s.top5.caught, s.stops), t("k2")(lift), t("k3")(s.top20.caught, s.stops), t("k4")(fmt(s.base_rate * 100, 1))];
  const box = document.getElementById("kpis"); box.replaceChildren(...items.map(([v, p]) => { const d = el("div", "kpi"); d.append(el("div", "v num", v), el("p", null, p)); return d; }));
  document.getElementById("honest").textContent = t("honest")(Math.round(1 / s.top5.precision));
}

function tipAt(tip, ev, lines) {
  tip.replaceChildren(...lines.map((l) => el("div", null, l))); tip.style.display = "block";
  const host = tip.parentElement.getBoundingClientRect();
  const x = ev.clientX - host.left, y = ev.clientY - host.top;
  tip.style.left = Math.max(6, Math.min(x + 12, host.width - tip.offsetWidth - 6)) + "px"; tip.style.top = Math.max(6, y - tip.offsetHeight - 10) + "px";
}

function renderCapture() {
  const box = document.getElementById("cap-chart"), tip = document.getElementById("cap-tip"); box.replaceChildren();
  const W = 420, H = 300, m = { l: 38, r: 14, t: 12, b: 30 };
  const X = (v) => m.l + v * (W - m.l - m.r), Y = (v) => H - m.b - v * (H - m.t - m.b);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("cap_title") }, box);
  [0, .25, .5, .75, 1].forEach((v) => { sv("line", { x1: X(0), x2: X(1), y1: Y(v), y2: Y(v), stroke: "var(--line)" }, svg);
    sv("text", { x: m.l - 6, y: Y(v) + 3, "text-anchor": "end" }, svg).textContent = pct(v);
    sv("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle" }, svg).textContent = pct(v); });
  sv("line", { x1: X(0), y1: Y(0), x2: X(1), y2: Y(1), stroke: "var(--muted)", "stroke-dasharray": "4 4" }, svg);
  const rl = sv("text", { x: X(.62), y: Y(.56), transform: `rotate(-33 ${X(.62)} ${Y(.56)})` }, svg); rl.textContent = t("cap_rand");
  const pts = DATA.capture;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  sv("path", { d: d + `L${X(1)},${Y(0)}L${X(0)},${Y(0)}Z`, fill: "var(--cobalt)", opacity: ".1" }, svg);
  sv("path", { d, fill: "none", stroke: "var(--cobalt)", "stroke-width": 2.5, "stroke-linejoin": "round" }, svg);
  const s = DATA.stats;
  [[.05, s.top5.caught / s.stops], [.2, s.top20.caught / s.stops]].forEach(([x, y]) => {
    sv("line", { x1: X(x), x2: X(x), y1: Y(0), y2: Y(y), stroke: "var(--signal)", "stroke-dasharray": "2 3" }, svg);
    sv("circle", { cx: X(x), cy: Y(y), r: 5, fill: "var(--signal)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
    const lb = sv("text", { x: X(x) + 8, y: Y(y) - 8 }, svg); lb.textContent = `${pct(x)} → ${pct(y)}`; lb.style.fill = "var(--ink)"; lb.style.fontWeight = "600"; });
  const hit = sv("rect", { x: X(0), y: Y(1), width: X(1) - X(0), height: Y(0) - Y(1), fill: "transparent" }, svg);
  hit.addEventListener("mousemove", (ev) => { const r = svg.getBoundingClientRect(); const xv = Math.max(0, Math.min(1, ((ev.clientX - r.left) / r.width * W - m.l) / (W - m.l - m.r)));
    const p = pts[Math.round(xv * 100)]; tipAt(tip, ev, [t("cap_tip")(pct(p.x), pct(p.y))]); });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; });
}

function renderSeasons() {
  const box = document.getElementById("ss-chart"), tip = document.getElementById("ss-tip"); box.replaceChildren();
  const keys = Object.keys(DATA.seasons).sort((a, b) => (a.slice(0, 4) + (a.endsWith("S") ? "0" : "1") < b.slice(0, 4) + (b.endsWith("S") ? "0" : "1") ? -1 : 1));
  const W = 520, rowH = 44, gap = 8, lab = 78, H = keys.length * (rowH + gap);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("ss_title") }, box);
  keys.forEach((k, i) => {
    const rows = DATA.seasons[k], y0 = i * (rowH + gap), base = y0 + rowH;
    const name = sv("text", { x: 0, y: y0 + rowH / 2 + 4 }, svg); name.textContent = `${k.slice(0, 4)} ${k.endsWith("S") ? t("spring") : t("autumn")}`;
    const bw = (W - lab) / Math.max(rows.length, 120);
    sv("line", { x1: lab, x2: W, y1: base, y2: base, stroke: "var(--line)" }, svg);
    rows.forEach(([night, eve, r, dec], j) => {
      const x = lab + j * bw, h = Math.max(1, r * (rowH - 10));
      const b = sv("rect", { x: x.toFixed(2), y: (base - h).toFixed(1), width: Math.max(.8, bw * .75).toFixed(2), height: h.toFixed(1), fill: r >= .9 ? "var(--signal)" : "var(--line)" }, svg);
      if (dec) sv("circle", { cx: (x + bw * .37).toFixed(1), cy: (base - h - 5).toFixed(1), r: 3.6, fill: "var(--stop)", stroke: "var(--surface)", "stroke-width": 1.2 }, svg);
      b.addEventListener("mousemove", (ev) => tipAt(tip, ev, [`${dayLabel(night, true)} · ${eve ? t("eve") : t("morn")}`, `${t("f_risk")}: ${pct(r)}${dec ? " · " + t("lg_stop") : ""}`]));
      b.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    });
  });
}

function renderBins() {
  const box = document.getElementById("bins-chart"), tip = document.getElementById("bins-tip"); box.replaceChildren();
  const rows = DATA.bins, W = 420, H = 240, m = { l: 38, r: 10, t: 22, b: 30 }, mx = Math.max(...rows.map((r) => r.stop_share)) * 1.15;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("bins_title") }, box);
  const bw = (W - m.l - m.r) / rows.length, Y = (v) => H - m.b - (v / mx) * (H - m.t - m.b);
  [0, .05, .1].forEach((v) => { sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--line)" }, svg); sv("text", { x: m.l - 6, y: Y(v) + 3, "text-anchor": "end" }, svg).textContent = pct(v); });
  const base = DATA.stats.base_rate;
  sv("line", { x1: m.l, x2: W - m.r, y1: Y(base), y2: Y(base), stroke: "var(--muted)", "stroke-dasharray": "4 4" }, svg);
  rows.forEach((r, i) => {
    const x = m.l + i * bw + bw * .18, w = bw * .64, col = r.bin === "95–100%" ? "var(--signal)" : r.bin === "90–95%" || r.bin === "80–90%" ? "#5AA2EC" : "var(--line)";
    const b = sv("rect", { x, y: Y(r.stop_share), width: w, height: Y(0) - Y(r.stop_share), rx: 6, fill: col }, svg);
    const v = sv("text", { x: x + w / 2, y: Y(r.stop_share) - 6, "text-anchor": "middle" }, svg); v.textContent = fmt(r.stop_share * 100, 1) + "%"; v.style.fill = "var(--ink)"; v.style.fontWeight = "600";
    sv("text", { x: x + w / 2, y: H - m.b + 16, "text-anchor": "middle" }, svg).textContent = r.bin;
    b.addEventListener("mousemove", (ev) => tipAt(tip, ev, [`${t("f_risk")} ${r.bin}`, `${fmt(r.stop_share * 100, 1)}% · n=${r.n}`, `${t("f_up")}: ${sign(r.price_dev)} ${t("eur_mwh")}`]));
    b.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

function renderLog() {
  const box = document.getElementById("loglist"); box.replaceChildren();
  [...DATA.log].reverse().forEach((r) => {
    const [d, w] = r.part.split(" "), row = el("div", "logrow");
    row.append(el("span", null, `${dayLabel(d, true)} · ${w === "утро" ? t("morn") : t("eve")} · ${t("in_d")(r.lead)}`), el("span", "num mono", pct(r.risk)), el("span", `verdict v-${r.verdict}`, t("verdicts")[r.verdict] || r.verdict));
    box.append(row);
  });
}

/* ---------------- сезоны и деньги ---------------- */
function renderMoney() {
  const yr = document.getElementById("year"); yr.replaceChildren(...t("months").map((mn, i) => el("div", i === 9 || i === 10 ? "peak" : [2, 3, 4, 8].includes(i) ? "on" : "", mn)));
  const bars = (id, rows, val, lbl, color, fmtv) => { const box = document.getElementById(id), mx = Math.max(...rows.map(val));
    box.replaceChildren(...rows.map((r) => { const d = el("div", "hbar"), tr = el("div", "t"), i = el("i"); i.style.width = `${(val(r) / mx) * 100}%`; i.style.background = color(r); tr.append(i);
      d.append(el("span", "mono", lbl(r)), tr, el("span", "val", fmtv(r))); return d; })); };
  bars("m-hours", DATA.hours, (r) => r.hours, (r) => r.year, () => "var(--cobalt)", (r) => `${fmt(r.hours)} ${t("h")}`);
  bars("m-loss", DATA.loss_meur, (r) => r.meur, (r) => r.year, () => "var(--stop)", (r) => `${fmt(r.meur, 1)} ${t("meur")}`);
  const box = document.getElementById("m-price"); box.replaceChildren();
  const mx = Math.max(...DATA.zones.map((z) => z.on_stop));
  DATA.zones.forEach((z) => { const d = el("div", "hbar"), tr = el("div", "t"); tr.style.position = "relative";
    const a = el("i"); a.style.width = `${(z.on_stop / mx) * 100}%`; a.style.background = "color-mix(in srgb, var(--signal) 35%, transparent)"; a.style.position = "absolute"; a.style.inset = "0 auto 0 0";
    const b = el("i"); b.style.width = `${(z.net / mx) * 100}%`; b.style.background = "var(--signal)"; b.style.position = "absolute"; b.style.inset = "0 auto 0 0"; tr.append(a, b);
    d.append(el("span", "mono", z.zone), tr, el("span", "val", `${sign(z.on_stop)}`)); d.title = `${t("net")}: ${sign(z.net)} ${t("eur_mwh")}`; box.append(d); });
  const lg = el("div", "legend"); lg.innerHTML = ""; const s1 = el("span"), i1 = el("i"); i1.style.background = "color-mix(in srgb, var(--signal) 35%, transparent)"; s1.append(i1, `${t("eur_mwh")}`);
  const s2 = el("span"), i2 = el("i"); i2.style.background = "var(--signal)"; s2.append(i2, t("net")); lg.append(s1, s2); box.append(lg);
}

/* ---------------- рынок: справочные цифры (источники в подписи раздела) ---------------- */
const MARKET = { epexTWh: 917.5, nordpoolTWh: 1231, nlWindShare: 0.25, deOffshoreTWh: 26.1, umm: 0, tsoMW: 728 };
function renderMarket() {
  const k = [[`${fmt(MARKET.epexTWh, 1)} ${t("twh")}`, t("m1")], [`${fmt(MARKET.nordpoolTWh)} ${t("twh")}`, t("m2")], [pct(MARKET.nlWindShare), t("m3")], [`${fmt(MARKET.deOffshoreTWh, 1)} ${t("twh")}`, t("m4")]];
  document.getElementById("mk-kpis").replaceChildren(...k.map(([v, p]) => { const d = el("div", "kpi"); d.append(el("div", "v num", v), el("p", null, p)); return d; }));
  const e = [[String(MARKET.umm), t("e1")], [`${fmt(MARKET.tsoMW)} MW`, t("e2")]];
  document.getElementById("mk-entsoe").replaceChildren(...e.map(([v, p], i) => { const d = el("div", "panel"); const b = el("div", "v num", v);
    b.style.cssText = `font-family:var(--f-display);font-size:2.4rem;font-weight:600;letter-spacing:-.04em;color:${i ? "var(--signal)" : "var(--cobalt)"}`; d.append(b, el("p", "muted", p)); return d; }));
}

/* ---------------- Европа ---------------- */
function renderEurope() {
  const box = document.getElementById("eu"); box.replaceChildren();
  const nights = [...new Set(DATA.europe.map((r) => r.night))].sort(); const n0 = nights[0];
  const order = ["NL", "DE", "BE", "DK", "GB", "FR", "NO"];
  DATA.europe.filter((r) => r.night === n0).sort((a, b) => order.indexOf(a.country) - order.indexOf(b.country)).forEach((r) => {
    const c = el("div", "c"), col = r.risk === "high" ? "var(--signal)" : r.risk === "elevated" ? "var(--cobalt)" : "var(--muted)";
    const idx = el("span", "idx", `${pct(r.index)} · ${t("risk_l")[r.risk]}`); idx.style.color = col;
    c.append(el("span", "eyebrow", dayLabel(r.night, true)), el("b", null, r.country), idx,
      el("span", "muted", r.eur6h == null ? t("eu_none") : `€${fmt(r.eur6h / 1e6, 1)}M ${t("eu_6h")}`));
    box.append(c);
  });
}

/* ---------------- запрос на сотрудничество ---------------- */
function openRequest(format) {
  document.getElementById("dlg-request").hidden = false;
  document.getElementById("req-fields").hidden = false; document.getElementById("req-result").hidden = true;
  document.getElementById("f-submit").hidden = false; document.getElementById("f-err").textContent = "";
  if (format) document.getElementById("f-format").value = format;
  document.getElementById("f-name").focus();
}
function closeDialogs() { document.querySelectorAll(".overlay").forEach((o) => { o.hidden = true; }); }
document.getElementById("request-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const v = (id) => document.getElementById(id).value.trim(), err = document.getElementById("f-err");
  const email = v("f-email");
  if (!v("f-name") || !v("f-company") || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = t("e_fill"); return; }
  err.textContent = "";
  const optText = (id) => { const s = document.getElementById(id); return s.options[s.selectedIndex].textContent; };
  const text = [`BirdWatt — ${t("req_h")}`, `${t("f_name")}: ${v("f-name")}`, `${t("f_company")}: ${v("f-company")}`, `E-mail: ${email}`,
    `${t("f_role")}: ${optText("f-role")}`, `${t("f_format")}: ${optText("f-format")}`, v("f-msg") ? `${t("f_msg")}: ${v("f-msg")}` : ""].filter(Boolean).join("\n");
  document.getElementById("req-text").value = text;
  document.getElementById("req-addr").textContent = CONFIG.contactEmail || t("contact_tbd");
  const mail = document.getElementById("req-mail");
  mail.hidden = !CONFIG.contactEmail;
  if (CONFIG.contactEmail) mail.href = `mailto:${CONFIG.contactEmail}?subject=${encodeURIComponent("BirdWatt — " + optText("f-format"))}&body=${encodeURIComponent(text)}`;
  document.getElementById("req-fields").hidden = true; document.getElementById("req-result").hidden = false; document.getElementById("f-submit").hidden = true;
  store.set("bw_request", { at: Date.now() });
});
document.getElementById("req-copy").addEventListener("click", () => {
  const ta = document.getElementById("req-text"), err = document.getElementById("f-err");
  navigator.clipboard.writeText(ta.value).then(() => { err.textContent = t("req_copied"); }, () => { ta.focus(); ta.select(); err.textContent = t("copy_fail"); });
});
document.querySelectorAll("[data-open=request]").forEach((b) => b.addEventListener("click", () => openRequest(b.dataset.format)));
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeDialogs));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDialogs(); });
document.getElementById("lang-sel").addEventListener("change", (e) => { lang = e.target.value; store.set("bw_lang", lang); renderAll(); });

function renderAll() {
  applyText();
  if (!DATA) return;
  document.getElementById("updated").textContent = t("updated")(DATA.generated_at);
  renderProofCard(); renderDecision(); renderKpis(); renderCapture(); renderSeasons(); renderBins(); renderLog(); renderMoney(); renderMarket(); renderEurope();
}

applyText();
fetch("bw_data.json").then((r) => r.json()).then((d) => { DATA = d; renderAll(); }).catch(() => {
  document.getElementById("nights").textContent = t("load_fail");
});
</script>
